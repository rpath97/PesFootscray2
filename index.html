<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC 
"-//W3C//DTD XHTML 1.0 Transitional//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta http-equiv="content-type" content="application/ce-html+xml; charset=UTF-8"/>
    <title>TV Dashboard</title>
    <link rel="stylesheet" href="ExerciseStyles.css"/>
    <!-- Ignore favicon request -->
		<link rel="icon" href="data:;base64,iVBORw0KGgo=">
		<!-- Initialize JAPIT Plugin first -->
		
		<!-- Then load other scripts -->
		<script type="text/javascript" src="menu.js"></script>
		<script type="text/javascript" src="entertainment.js"></script>
		<script type="text/javascript" src="ExerciseController.js"></script>
		<script type="text/javascript" src="ExerciseView.js"></script>
		<script type="text/javascript" src="ExerciseUtility.js"></script>
		<script type="text/javascript" src="JAPITfunctions.js"></script>
		<script type="text/javascript" src="tvChannels.js"></script>
        <script type="text/javascript" src="JAPITmodel.js"></script>
        <script type="text/javascript" src="excelReader.js"></script>
        <script type="text/javascript" src="radioChannels.js"></script>
        <script type="text/javascript" src="clinical-services.js"></script>
        <script type="text/javascript" src="my-care.js"></script>
        

		<!-- Added for Spatial Navigation -->
		<script src="spatnav-heuristic.js"></script>
		<script src="spatnav-api.js"></script>
		<script>focusNavigationHeuristics();</script>
		<!-- End of Spatial Navigation Section-->
         

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Add this in the head section -->
    <script type="text/javascript" src="my-care.js"></script>
    <script type="text/javascript" src="hospital-info.js"></script>
</head>

<body onload="init()">
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar shadow-sm">
            <!-- <div class="logo py-4"> -->
                <img src="logos/westernhealthlogo.png" alt="Western Health" class="img-fluid sidebar-logo">
            <!-- </div> -->
            <nav class="menu d-flex flex-column">
                <!-- <div class="menu"> -->
                    <button class="menu-item japit-button" id="entertainmentButton"
                            data-type="entertainment"
                            data-japit-control="true"
                        data-japit-focusable="true"
                        data-action="entertainment"
                            onclick="handleEntertainmentClick()">
                    <img src="logos/entertainment.png" alt="Entertainment">
                    <span>Entertainment</span>
                </button>
                    
                    <!-- Add separator div -->
                    <div class="menu-separator"></div>
                    
                <button class="menu-item japit-button"
                            data-type="hospitalinfo"
                            data-japit-control="true"
                        data-japit-focusable="true"
                            data-action="hospitalinfo"
                            onclick="handleHospitalInfoClick()">
                    <img src="logos/hospitalinformation.png" alt="Hospital Info">
                    <span>Hospital Info</span>
                </button>
                <button class="menu-item japit-button"
                            data-type="my-care"
                            data-japit-control="true"
                        data-japit-focusable="true"
                        data-action="my-care"
                            onclick="handleMyCareButtonClick()">
                    <img src="logos/mycare.png" alt="My Care">
                    <span>My Care</span>
                </button>
                <button class="menu-item japit-button"
                            data-type="clinical-services"
                            data-japit-control="true"
                        data-japit-focusable="true"
                        data-action="clinical-services"
                            onclick="handleClinicalServicesClick()">
                    <img src="logos/clinicalservices.png" alt="Clinical Services">
                    <span>Clinical Services</span>
                </button>
                </div>
            </nav>
        </div>

        <!-- Main Content Area -->
        <div class="main-content flex-grow-1">
            <!-- <div class="header bg-white shadow-sm py-2 px-4 d-flex justify-content-end align-items-center"> -->
                <div class="time text-end"></div>
            <!-- </div> -->
            
            <!-- Default View -->
            <div class="content default-view h-100 position-relative" id="default_view">
                <img src="logos/newfootscrayhospital.jpg" alt="newfootscrayhospital" class="main-image">
            </div>

            <!-- Entertainment View -->
            <div class="content entertainment-view py-4" style="display: none;" id="entertainment_menu">
                <!-- <div class="container-fluid"> -->
                    <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                        <!-- TV Button -->
                        <!-- <div class="col"> -->
                            <button class="entertainment-card japit-button"
                                    data-type="tv"
                                    id="tv_button"
                                    data-japit-control="true"
                                    data-japit-focusable="true"
                                    data-action="tv"
                                    onclick="openTV()">
                                <img src="logos/television.png" alt="TV">
                                <span>Television</span>
                            </button>
                        <!-- </div> -->
                        <!-- Movies Button -->
                        <!-- <div class="col"> -->
                            <button class="entertainment-card japit-button"
                                    data-type="movies"
                                    data-japit-control="true"
                                    data-japit-focusable="true"
                                    data-action="movies"
                                    onclick="handleMoviesClick()">
                                <img src="logos/movies.png" alt="Movies">
                                <span>Movies</span>
                            </button>
                        <!-- </div> -->
                        <!-- Radio Button -->
                        <!-- <div class="col"> -->
                            <button class="entertainment-card japit-button"
                                    data-type="radio"
                                    data-japit-control="true"
                                    data-japit-focusable="true"
                                    data-action="radio"
                                    onclick="handleRadioClick()">
                                <img src="logos/radio.png" alt="Radio">
                                <span>Radio</span>
                            </button>
                        <!-- </div> -->
                        <!-- Casting Button -->
                        <!-- <div class="col"> -->
                            <button class="entertainment-card japit-button"
                                    data-type="casting"
                                    data-japit-control="true"
                                    data-japit-focusable="true"
                                    data-action="casting"
                                    onclick="handleCastingClick()">
                                <img src="logos/casting.png" alt="Casting">
                                <span>Casting</span>
                            </button>
                        <!-- </div> -->
                    </div>
                <!-- </div> -->
            </div>

            <!-- My Care View -->
            <div class="content my-care-view" style="display: none;" id="mycare_menu">
                <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                    <!-- <div class="my-care-grid"> -->
                        <button class="mycare-card japit-button"
                                id="management-and-discharge-button"
                                data-type="management-and-discharge"
                                data-japit-control="true"
                                data-japit-focusable="true"
                                data-action="management-and-discharge"
                                onclick="handleManagementandDischargeClick()">
                            <img src="logos/Management and Discharge.png" alt="Management and Discharge">
                            <span>Management and Discharge</span>
                        </button>
                        <button class="mycare-card japit-button"
                                data-type="carers-survey"
                                data-japit-control="true"
                                data-japit-focusable="true"
                                data-action="carers-survey"
                                onclick="handleCarersSurveyClick()">
                            <img src="logos/Carers Survey.png" alt="Carers Survey">
                            <span>Carers Survey</span>
                        </button>
                        <button class="mycare-card japit-button"
                                data-type="patient-survey"
                                data-japit-control="true"
                                data-japit-focusable="true"
                                data-action="patient-survey"
                                onclick="handlePatientSurveyClick()">
                            <img src="logos/patientsurvey.png" alt="Patient Survey">
                            <span>Patient Survey</span>
                        </button>
                        <button class="mycare-card japit-button"
                                data-type="blacktown-surveys"
                                data-japit-control="true"
                                data-japit-focusable="true"
                                data-action="blacktown-surveys"
                                onclick="handleBlacktownSurveysClick()">
                            <img src="logos/blacktownsurvey.png" alt="Blacktown Surveys">
                            <span>Blacktown Surveys</span>
                        </button>
                    <!-- </div> -->
                </div>
            </div>

            <!-- Clinical Services View -->
            <div class="content clinical-services-view" style="display: none;" id="clinicalservices_menu">
                <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                    <button class="clinical-card japit-button" 
                            id="clinical-sharing-button"
                            data-type="sharing"
                            data-japit-control="true"
                            data-japit-focusable="true"
                            data-action="sharing"
                            onclick="openClicnicalCasting()">
                        <img src="logos/clinicalsharing.png" alt="Clinical Sharing">
                        <span>Clinical Sharing</span>
                    </button>
                </div>
            </div>

            <!-- Hospital Info View -->
            <div class="content hospital-info-view" style="display: none;" id="hospitalinfo_menu">
                <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">   <!-- Welcome -->
                        <!-- <div class="col"> -->
                            <button class="hospital-info-card japit-button"
                                    id="welcome-button"
                                    data-type="welcome"
                                    data-japit-control="true"
                                    data-japit-focusable="true"
                                    data-action="welcome"
                                    onclick="handleWelcomeClick()">
                                <img src="logos/welcome.png" alt="Welcome">
                                <span>Welcome</span>
                            </button>
                        <!-- </div> -->
                        <!-- Visiting Hours -->
                        <!-- <div class="col"> -->
                            <button class="hospital-info-card japit-button"
                                    id="hospital-info-button"
                                    data-type="visiting"
                                    data-japit-control="true"
                                    data-japit-focusable="true"
                                    data-action="visiting"
                                    onclick="handleVisitingClick()">
                                <img src="logos/visitinghours.png" alt="Visiting Hours">
                                <span>Visiting Hours</span>
                            </button>
                        <!-- </div> -->
                        <!-- Healthcare Rights -->
                        <!-- <div class="col"> -->
                            <button class="hospital-info-card japit-button"
                                    id="healthcare-rights-button"
                                    data-type="rights"
                                    data-japit-control="true"
                                    data-japit-focusable="true"
                                    data-action="rights"
                                    onclick="handleRightsClick()">
                                <img src="logos/healthcarerights.png" alt="Healthcare Rights">
                                <span>Healthcare Rights</span>
                            </button>
                        <!-- </div> -->
                        <!-- Reach -->
                        <!-- <div class="col"> -->
                            <button class="hospital-info-card japit-button"
                                    data-type="reach"
                                    data-japit-control="true"
                                    data-japit-focusable="true"
                                    data-action="reach"
                                    onclick="handleReachClick()">
                                <img src="logos/reach.png" alt="Reach">
                                <span>Reach</span>
                            </button>
                        <!-- </div> -->
                    </div>
            </div>

            <!-- Radio View -->
            <div class="content radio-view" style="display: none;" id="radio_view">
                <!-- Radio channels will be dynamically added here by handleRadioClick() -->
            </div>

            <!-- Video Frame -->
            <!-- <div class="video-grid" id="video-frame">
                <iframe id="video-src-iframe" src="" width="100%" display="none" height="100%" frameborder="0" allowfullscreen/>
             </div> -->

            <!-- Log Windows -->
            <div id="IDJAPITToTV_Misc" class="JAPITToTV_Misc">
                <p id="IdHeadingLogMsg" class="IOContentsColor">WIXP (CDB --> TV) And Other Logs</p>
                <textarea id="logmsg" rows="90" cols="70" style="resize:none" readonly></textarea>
            </div>
            
            <div id="IDJAPITFromTV" class="JAPITFromTV">
                <p id="IdHeadingLogMsgCallback" class="IOContentsColor">WIXP (TV --> CDB)</p>
                <textarea id="logmsgcallback" rows="90" cols="70" style="resize:none" readonly></textarea>
            </div>
        </div>
    </div>
    

    <!-- JAPIT WIXP Plugin -->
    <object id="JAPITWIXPPlugin" 
            type="application/jswebixp"
            width="0" 
            height="0" 
            style="visibility: hidden"
            onload="pluginLoaded()">
    </object>

     <!-- Video Frame -->
     <div class="video-grid" id="video-frame">
        <iframe id="video-src-iframe" src="" width="100%" height="100%" frameborder="0" allowfullscreen/>
     </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Toast container for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
</body>
</html>
