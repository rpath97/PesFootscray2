<body onload="init(); getProfessionalSettings(); focusImageChange();">
    <div class="container-fluid  p-0 mw-100 mh-100">
        <!-- Header -->
        <div class="header">
            <div class="branding">

            <div class="time">

            </div>
        </div>

                <div class="sidebar-menu">
                    <button class="menu-item japit-button" id="entertainmentButton" data-type="entertainment"
                        data-japit-control="true" data-japit-focusable="true" data-action="entertainment"
                        onfocus="handleEntertainmentClick()">
                        <img src="logos/sidemenu/entertainment.png" alt="Entertainment">
                        <span>Entertainment</span>
                    </button>
                    <button class="menu-item japit-button" data-type="hospitalinfo" data-japit-control="true"
                        data-japit-focusable="true" data-action="hospitalinfo" onfocus="handleHospitalInfoClick()">
                        <img src="logos/sidemenu/hospitalinformation.png" alt="Hospital Info">
                        <span>Hospital Info</span>
                    </button>
                    <button class="menu-item japit-button" data-type="my-care" data-japit-control="true"
                        data-japit-focusable="true" data-action="my-care" onfocus="handleMyCareButtonClick()">
                        <img src="logos/sidemenu/mycare.png" alt="My Care">
                        <span>My Care</span>
                    </button>
                    <button class="menu-item japit-button" data-type="clinical-services" data-japit-control="true"
                        data-japit-focusable="true" data-action="clinical-services"
                        onfocus="handleClinicalServicesClick()">
                        <img src="logos/sidemenu/clinicalservices.png" alt="Clinical Services">
                        <span>Clinical Services</span>
                    </button>
                </div>
            </div>

            <!-- TEMP BUTTONs -->
            <button onclick="backTemp()"

                Back
            </button>
            <button onclick="tempEnter()"
                style="width: 50px; height: 20px; position: absolute; top: 20px; right: 100px; z-index: 1100;">
                Enter
            </button>
            <button onclick="tempRightButton()"
                style="width: 50px; height: 20px; position: absolute; top: 20px; right: 150px; z-index: 1100;">
                Right
            </button>
            <button onclick="tempLeftButton()"

                Leeft
            </button>

                            </button>

                                </button>
                            </div>
