<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <meta http-equiv="content-type" content="application/ce-html+xml; charset=UTF-8" />
    <title>TV Dashboard</title>
    <link rel="stylesheet" href="ExerciseStyles.css" />
    <!-- Ignore favicon request -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <!-- Initialize JAPIT Plugin first -->

    <!-- Then load other scripts -->
    <script type="text/javascript" src="menu.js"></script>
    <script type="text/javascript" src="entertainment.js"></script>
    <script type="text/javascript" src="ExerciseController.js"></script>
    <script type="text/javascript" src="ExerciseView.js"></script>
    <script type="text/javascript" src="ExerciseUtility.js"></script>
    <script type="text/javascript" src="JAPITfunctions.js"></script>
    <script type="text/javascript" src="tvChannels.js"></script>
    <script type="text/javascript" src="JAPITmodel.js"></script>
    <script type="text/javascript" src="excelReader.js"></script>
    <script type="text/javascript" src="radioChannels.js"></script>
    <script type="text/javascript" src="clinical-services.js"></script>
    <script type="text/javascript" src="my-care.js"></script>
    <script src="hlsVideoPlayer.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>



    <!-- Added for Spatial Navigation -->
    <script src="spatnav-heuristic.js"></script>
    <script src="spatnav-api.js"></script>
    <script>focusNavigationHeuristics();</script>
    <!-- End of Spatial Navigation Section-->


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Add this in the head section -->
    <script type="text/javascript" src="my-care.js"></script>
    <script type="text/javascript" src="hospital-info.js"></script>
</head>

<body onload="init()">
    <div class="container-fluid  p-0 mw-100 mh-100">
        <!-- Header -->
        <div class="header">
            <div class="branding">
                <img src="logos/westernhealthlogo.png" alt="Western Health" class="logo">
            </div>
            <div class="time">
                <div class="time-display">Friday 14 March 2025 at 11:41</div>
            </div>
        </div>

        <div class="non-header">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-menu">
                    <button class="menu-item japit-button" id="entertainmentButton" data-type="entertainment"
                        data-japit-control="true" data-japit-focusable="true" data-action="entertainment"
                        onclick="handleEntertainmentClick()">
                        <img src="logos/sidemenu/entertainment.png" alt="Entertainment">
                        <span>Entertainment</span>
                    </button>
                    <button class="menu-item japit-button" data-type="hospitalinfo" data-japit-control="true"
                        data-japit-focusable="true" data-action="hospitalinfo" onclick="handleHospitalInfoClick()">
                        <img src="logos/sidemenu/hospitalinformation.png" alt="Hospital Info">
                        <span>Hospital Info</span>
                    </button>
                    <button class="menu-item japit-button" data-type="my-care" data-japit-control="true"
                        data-japit-focusable="true" data-action="my-care" onclick="handleMyCareButtonClick()">
                        <img src="logos/sidemenu/mycare.png" alt="My Care">
                        <span>My Care</span>
                    </button>
                    <button class="menu-item japit-button" data-type="clinical-services" data-japit-control="true"
                        data-japit-focusable="true" data-action="clinical-services"
                        onclick="handleClinicalServicesClick()">
                        <img src="logos/sidemenu/clinicalservices.png" alt="Clinical Services">
                        <span>Clinical Services</span>
                    </button>
                </div>
            </div>

            <!-- TEMP BACK BUTTON -->
            <button onclick="backTemp()"
                style="width: 50px; height: 20px; position: absolute; top: 20px; right: 50px; z-index: 1100;">
                Back
            </button>

            <!-- Non-sidebar / Main Content Area -->
            <div class="non-sidebar">
                <!-- Default View -->
                <div class="view1 default-view" id="default_view">
                    <img src="logos/newfootscrayhospital.jpg" alt="newfootscrayhospital" class="main-image">
                </div>

                <!-- TEMP BACK BUTTON -->
                <!-- <button onclick="backTemp()"  style="width: 50px; height: 20px; position: absolute; top: 20px; right: 50px; z-index: 1100;" >
                Back
            </button> -->

                <!-- Other Views (Initially Hidden) -->
                <div class="view2">
                    <!-- Entertainment View -->
                    <div class="entertainment-view" id="entertainment_menu" style="display: none;">
                        <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                            <!-- TV Button -->
                            <button class="entertainment-card japit-button" data-type="tv" id="tv_button"
                                data-japit-control="true" data-japit-focusable="true" data-action="tv"
                                onclick="openTV()">
                                <img src="logos/entertainment/television.png" alt="TV">
                                <span>Television</span>
                            </button>
                            <!-- Movies Button -->
                            <button class="entertainment-card japit-button" data-type="movies" data-japit-control="true"
                                data-japit-focusable="true" data-action="movies" onclick="handleMoviesClick()">
                                <img src="logos/entertainment/movies.png" alt="Movies">
                                <span>Movies</span>
                            </button>
                            <!-- Radio Button -->
                            <button class="entertainment-card japit-button" data-type="radio" data-japit-control="true"
                                data-japit-focusable="true" data-action="radio" onclick="handleRadioClick()">
                                <img src="logos/entertainment/radio.png" alt="Radio">
                                <span>Radio</span>
                            </button>
                            <!-- Casting Button -->
                            <button class="entertainment-card japit-button" data-type="casting"
                                data-japit-control="true" data-japit-focusable="true" data-action="casting"
                                onclick="handleCastingClick()">
                                <img src="logos/entertainment/casting.png" alt="Casting">
                                <span>Casting</span>
                            </button>
                        </div>
                    </div>

                    <!-- My Care View -->
                    <div class="my-care-view" id="mycare_menu" style="display: none;">
                        <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                            <button class="mycare-card japit-button" id="management-and-discharge-button"
                                data-type="management-and-discharge" data-japit-control="true"
                                data-japit-focusable="true" data-action="management-and-discharge"
                                onclick="handleManagementandDischargeClick()">
                                <img src="logos/mycare/managementanddischarge.png" alt="Management and Discharge">
                                <span>Management and Discharge</span>
                            </button>
                            <button class="mycare-card japit-button" data-type="carers-survey" data-japit-control="true"
                                data-japit-focusable="true" data-action="carers-survey"
                                onclick="handleCarersSurveyClick()">
                                <img src="logos/mycare/CarersSurvey.png" alt="Carers Survey">
                                <span>Carers Survey</span>
                            </button>
                            <button class="mycare-card japit-button" data-type="patient-survey"
                                data-japit-control="true" data-japit-focusable="true" data-action="patient-survey"
                                onclick="handlePatientSurveyClick()">
                                <img src="logos/mycare/patientsurvey.png" alt="Patient Survey">
                                <span>Patient Survey</span>
                            </button>
                            <button class="mycare-card japit-button" data-type="blacktown-surveys"
                                data-japit-control="true" data-japit-focusable="true" data-action="blacktown-surveys"
                                onclick="handleBlacktownSurveysClick()">
                                <img src="logos/mycare/blacktownsurvey.png" alt="Blacktown Surveys">
                                <span>Blacktown Surveys</span>
                            </button>
                        </div>
                    </div>

                    <!-- Clinical Services View -->
                    <div class="clinical-services-view" id="clinicalservices_menu" style="display: none;">
                        <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                            <button class="clinical-card japit-button" id="clinical-sharing-button" data-type="sharing"
                                data-japit-control="true" data-japit-focusable="true" data-action="sharing"
                                onclick="openClicnicalCasting()">
                                <img src="logos/clinicalsharing.png" alt="Clinical Sharing">
                                <span>Clinical Sharing</span>
                            </button>
                        </div>
                    </div>

                    <!-- Hospital Info View -->
                    <div class="hospital-info-view" id="hospitalinfo_menu" style="display: none;">
                        <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center"> <!-- Welcome -->
                            <button class="hospital-info-card japit-button" id="welcome-button" data-type="welcome"
                                data-japit-control="true" data-japit-focusable="true" data-action="welcome"
                                onclick="handleWelcomeClick()">
                                <img src="logos/welcome.png" alt="Welcome">
                                <span>Welcome</span>
                            </button>
                            <!-- Visiting Hours -->
                            <button class="hospital-info-card japit-button" id="hospital-info-button"
                                data-type="visiting" data-japit-control="true" data-japit-focusable="true"
                                data-action="visiting" onclick="handleVisitingClick()">
                                <img src="logos/visitinghours.png" alt="Visiting Hours">
                                <span>Visiting Hours</span>
                            </button>
                            <!-- Healthcare Rights -->
                            <button class="hospital-info-card japit-button" id="healthcare-rights-button"
                                data-type="rights" data-japit-control="true" data-japit-focusable="true"
                                data-action="rights" onclick="handleRightsClick()">
                                <img src="logos/healthcarerights.png" alt="Healthcare Rights">
                                <span>Healthcare Rights</span>
                            </button>
                            <!-- Reach -->
                            <button class="hospital-info-card japit-button" data-type="reach" data-japit-control="true"
                                data-japit-focusable="true" data-action="reach" onclick="handleReachClick()">
                                <img src="logos/reach.png" alt="Reach">
                                <span>Reach</span>
                            </button>
                        </div>

                    </div>

                    <!-- Radio View -->
                    <div class="radio-view" id="radio_view" style="display: none;">
                        <!-- Radio channels will be dynamically added here by handleRadioClick() -->
                    </div>
                </div>
            </div>
            <!-- Log Windows -->
            <div id="IDJAPITToTV_Misc" class="JAPITToTV_Misc">
                <p id="IdHeadingLogMsg" class="IOContentsColor">WIXP (CDB --> TV) And Other Logs</p>
                <textarea id="logmsg" rows="90" cols="70" style="resize:none" readonly></textarea>
            </div>

            <div id="IDJAPITFromTV" class="JAPITFromTV">
                <p id="IdHeadingLogMsgCallback" class="IOContentsColor">WIXP (TV --> CDB)</p>
                <textarea id="logmsgcallback" rows="90" cols="70" style="resize:none" readonly></textarea>
            </div>
        </div>

    </div>
    <!-- TV LOADING BUFFER -->
    <div id="loadingGif">
        <img id="tv-buffer" src="logos/tvLoadingGif.gif" width="30%" height="30%" alt="GIF">
    </div>


    </div>
    <!-- Toast container for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <!-- CHANNEL VIEWER -->
    <!-- <div id="tvChannelDiv" style="width: 100%; height: 100%; position: absolute; top: 0;right: 0; z-index: -1;"> 
        <object id="vidObject" style="position:absolute;" type="video/broadcast" width="100%" height="100%"/>
     </div> -->
    <!-- CHANNEL VIEWER -->
    <!-- PDF VIEWER OPTIONs -->
    <div id="pdf-viewers">
        <!-- PDF VIEWER OPTION 2 -->
        <iframe id="pdf-viewer-2" src="https://pdfobject.com/pdf/sample.pdf" width="100%" height="100%"
            display="none"></iframe>
        <!-- PDF VIEWER OPTION 3 -->
        <embed id="pdf-viewer-3" src="https://pdfobject.com/pdf/sample.pdf" type="application/pdf" width="100%"
            height="100%" />
        <!-- PDF VIEWER OPTION 4 -->
        <object id="pdfViewer" type="application/pdf" style="z-index: 1201;  width: 100%; height: 99%;"></object>

    </div>


    <!-- JAPIT WIXP Plugin -->
    <object id="JAPITWIXPPlugin" type="application/jswebixp" width="0" height="0" style="visibility: hidden"
        onload="pluginLoaded()">
    </object>

    <!-- Video Frame -->
    <!-- <div class="video-grid" id="video-frame">
        <iframe id="video-src-iframe" src="" width="100%" height="100%" frameborder="0" allowfullscreen>
        </iframe>
     </div> -->
    <!-- Second type video frame -->
    <video id="video-frame" controls autoplay>
        <source id="video-src-iframe" src="" type="video/mp4">
        Your browser does not support the video tag.
    </video>




</body>

</html>
