<body onload="init(); getProfessionalSettings(); focusImageChange();">
    <div class="container-fluid  p-0 mw-100 mh-100">
        <!-- Header -->
        <div class="header">
            <div class="branding">
                <img src="logos/westernhealthlogo.png" alt="Western Health" class="logo">
            </div>
            <div class="time">
                <div class="time-display">Friday 14 March 2025 at 11:41</div>
            </div>
        </div>

        <div class="non-header">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-menu">
                    <button class="menu-item japit-button" id="entertainmentButton" data-type="entertainment"
                        data-japit-control="true" data-japit-focusable="true" data-action="entertainment"
                        onfocus="handleEntertainmentClick()">
                        <img src="logos/sidemenu/entertainment.png" alt="Entertainment">
                        <span>Entertainment</span>
                    </button>
                    <button class="menu-item japit-button" data-type="hospitalinfo" data-japit-control="true"
                        data-japit-focusable="true" data-action="hospitalinfo" onfocus="handleHospitalInfoClick()">
                        <img src="logos/sidemenu/hospitalinformation.png" alt="Hospital Info">
                        <span>Hospital Info</span>
                    </button>
                    <button class="menu-item japit-button" data-type="my-care" data-japit-control="true"
                        data-japit-focusable="true" data-action="my-care" onfocus="handleMyCareButtonClick()">
                        <img src="logos/sidemenu/mycare.png" alt="My Care">
                        <span>My Care</span>
                    </button>
                    <button class="menu-item japit-button" data-type="clinical-services" data-japit-control="true"
                        data-japit-focusable="true" data-action="clinical-services"
                        onfocus="handleClinicalServicesClick()">
                        <img src="logos/sidemenu/clinicalservices.png" alt="Clinical Services">
                        <span>Clinical Services</span>
                    </button>
                </div>
            </div>

            <!-- TEMP BUTTONs -->
            <!-- <button onclick="backTemp()"
                style="width: 50px; height: 20px; position: absolute; top: 20px; right: 50px; z-index: 1100;">

            <button onclick="tempEnter()"

            <!-- TEMP BUTTONs -->

            <!-- Non-sidebar / Main Content Area -->
            <div class="non-sidebar">
                <!-- Default View -->
                <div class="view1 default-view" id="default_view">
                    <img src="logos/newfootscrayhospital.jpg" alt="newfootscrayhospital" class="main-image">
                </div>

                <!-- TEMP BACK BUTTON -->
                <!-- <button onclick="backTemp()"  style="width: 50px; height: 20px; position: absolute; top: 20px; right: 50px; z-index: 1100;" >
                Back
            </button> -->

                <!-- Other Views (Initially Hidden) -->
                <!-- <div class="view2"> -->
                <!-- Entertainment View -->
                <div class="submenu-view" id="entertainment_menu" style="display: none;">
                    <!-- First Row -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card" onclick="openTV()" button-focus="television">
                            <img src="logos/entertainment/television.png" alt="TV">
                            <span>Television</span>
                        </button>
                    </div>
                    <!-- Casting under Television -->
                    <!-- <div class="mt-4"> -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card" onclick="handleCastingClick()" button-focus="casting">
                            <img src="logos/entertainment/casting.png" alt="Casting">
                            <span>Casting</span>
                        </button>
                    </div>
                    <!-- </div>
                        </div> -->

                    <!-- <div class="col-md-3"> -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card" onclick="handleMoviesClick()" button-focus="movies">
                            <img src="logos/entertainment/movies.png" alt="Movies">
                            <span>Movies</span>
                        </button>
                    </div>
                    <!-- </div> -->

                    <!-- <div class="col-md-3"> -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card" onclick="handleRadioClick()" button-focus="radio">
                            <img src="logos/entertainment/radio.png" alt="Radio">
                            <span>Radio</span>
                        </button>
                    </div>
                    <!-- </div> -->

                </div>

                <!-- My Care View -->
                    <div class="submenu-view" id="mycare_menu" style="display: none;">
        
                        <!-- First Row -->
                        <div class="sub-menu-buttons">
                            <button class="submenu-card2" id="management-and-discharge-button"
                                button-focus="management-and-discharge-button"
                                onclick="handleManagementandDischargeClick()">
                                <img src="logos/mycare/managementanddischarge.png" alt="Management and Discharge">
                                <span>Management and Discharge</span>
                            </button>
                        </div>
                        <!-- Blacktown Surveys under Management and Discharge -->
                        <div class="sub-menu-buttons">
                            <button class="submenu-card2"
                                button-focus="blacktown-surveys"
                                onclick="handleBlacktownSurveysClick()">
                                <img src="logos/mycare/blacktownsurvey.png" alt="Blacktown Surveys">
                                <span>Blacktown Surveys</span>
                            </button>
                        </div>


                        <div class="sub-menu-buttons">
                            <button class="submenu-card2"
                                button-focus="carers-surveys"
                                onclick="handleCarersSurveyClick()">
                                <img src="logos/mycare/CarersSurvey.png" alt="Carers Survey">
                                <span>Carers Survey</span>
                            </button>
                        </div>

                        <div class="sub-menu-buttons">
                            <button class="submenu-card2"
                                 button-focus="patient-survey"
                                onclick="handlePatientSurveyClick()">
                                <img src="logos/mycare/patientsurvey.png" alt="Patient Survey">
                                <span>Patient Survey</span>
                            </button>
                        </div>
                    
                     </div>


                <!-- Clinical Services View -->
                <div class="submenu-view" id="clinicalservices_menu" style="display: none;">
                    <!-- First Row -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card3" id="clinical-sharing-button"
                            button-focus="clinical-sharing"
                            onclick="openClinicalSharing()">
                            <img src="logos/clinicalservices/clinicalsharing.png" alt="Clinical Sharing">
                            <span>Clinical Sharing</span>
                        </button>
                    </div>

                    <!-- Clinical Section -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card3" id="time-button"
                            button-focus="time"
                            onclick="handleClinicalClick()">
                            <img src="logos/clinicalservices/time.png" alt="Clinical">
                            <span>Time</span>
                        </button>
                    </div>

                    <!-- Information Section -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card3" id="information-button"
                            button-focus="information"
                            onclick="handleInformationClick()">
                            <img src="logos/clinicalservices/information.png" alt="Information">
                            <span>Information</span>
                        </button>
                    </div>
                </div>
                <!-- Hospital Info View -->
                <div class="submenu-view" id="hospitalinfo_menu" style="display: none;">
                    <!-- First Row -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card4" id="welcome-button"
                            button-focus="welcome"
                            onclick="handleWelcomeClick()">
                            <img src="logos/welcome.png" alt="Welcome">
                            <span>Welcome</span>
                        </button>
                    </div>
                    
                    <!-- Visiting Hours under Welcome -->
                    <div class="sub-menu-buttons">
                        <button class="submenu-card4" id="hospital-info-button"
                            button-focus="visiting"
                            onclick="handleVisitingClick()">
                            <img src="logos/visitinghours.png" alt="Visiting Hours">
                            <span>Visiting Hours</span>
                        </button>
                    </div>
                    
                    <div class="sub-menu-buttons">
                        <button class="submenu-card4" id="healthcare-rights-button"
                            button-focus="rights"
                            onclick="handleRightsClick()">
                            <img src="logos/healthcarerights.png" alt="Healthcare Rights">
                            <span>Healthcare Rights</span>
                        </button>
                    </div>
                    
                    <div class="sub-menu-buttons">
                        <button class="submenu-card4" id="reach-button"
                            button-focus="reach"
                            onclick="handleReachClick()">
                            <img src="logos/reach.png" alt="Reach">
                            <span>Reach</span>
                        </button>
                    </div>
                </div>


                <!-- Radio View -->
                <div class="radio-view" id="radio_view" style="display: none;">
                    <!-- Radio channels will be dynamically added here by handleRadioClick() -->
                    <div id="radio-left-column">
                        <!-- Buttons will be generated here -->

                    </div>
                    <div id="radio-right-column">
                        <p id="radio_title">Select radio station to play</p>
                        <div style="display: flex; flex-direction: column; align-items: center;">
                            <img id="radio-logo-right" src="">
                            <div id="gif-title" class="marquee"></div>
                            <img id="gif" src="logos/soundbarcircle.gif" style="display: none;" alt="GIF">

                        </div>
                        <!-- Spacers -->
                        <!-- <div></div>
                        <div></div> -->

                    </div>
                </div>
            </div>
        </div>
        <!-- Log Windows -->
        <div id="IDJAPITToTV_Misc" class="JAPITToTV_Misc">
            <p id="IdHeadingLogMsg" class="IOContentsColor">WIXP (CDB --> TV) And Other Logs</p>
            <textarea id="logmsg" rows="90" cols="70" style="resize:none" readonly></textarea>
        </div>

        <div id="IDJAPITFromTV" class="JAPITFromTV">
            <p id="IdHeadingLogMsgCallback" class="IOContentsColor">WIXP (TV --> CDB)</p>
            <textarea id="logmsgcallback" rows="90" cols="70" style="resize:none" readonly></textarea>
        </div>
    </div>

    </div>
    <!-- TV LOADING BUFFER -->
    <div id="loadingGif">
        <img id="tv-buffer" src="logos/tvLoadingGif.gif" width="30%" height="30%" alt="GIF">
    </div>


    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
